version: 2

updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
