version: 2

updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  # The cooldown here is the dynamic layer; pyproject's `exclude-newer` is a fixed ceiling that
  # caps these PRs too, and check-cooldown-date.py fails lint once it goes stale (F076).
  - package-ecosystem: uv
    directory: "/tools/llm-gate"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
