version: 2

updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  # Two layers, now the same length: this cooldown delays the PR, and pyproject's `exclude-newer`
  # caps what uv may resolve when Dependabot re-locks. That cap used to be a fixed date, which no
  # re-lock could ever get past (F076); it is a rolling 14-day window, and scripts/check-cooldown.py
  # fails the lint gate if it turns back into a date or stops matching this number.
  - package-ecosystem: uv
    directory: "/tools/llm-gate"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
