name: Test report
description: >-
  Publish test results as a check run with annotations on the failing line (dorny/test-reporter),
  in up to three attempts. GitHub sometimes answers 404 to the check-run update that follows the
  create by half a second (dorny/test-reporter#866); the action tries that update once, so a
  passing run went red. The test step is the gate: it fails the job on a failing test by its own
  exit code. This action only reports. Drop the retries once upstream ships its own.
inputs:
  name:
    description: Name of the check run
    required: true
  path:
    description: Report file(s), glob allowed
    required: true
  reporter:
    description: Report format (dotnet-trx, java-junit, ...)
    required: true
runs:
  using: composite
  steps:
    # fail-on-error false: a failing test already fails the job in the test step, so an attempt
    # fails only when *reporting* fails (API error, missing or unparsable report), and a genuine
    # test failure doesn't post its report again.
    #
    # Each attempt creates a new check run of the same name. A failed attempt leaves its check run
    # in_progress, but GitHub shows only the newest check run per name (`filter=latest`, the PR's
    # checks list), so a later successful attempt supersedes it. A proof run on #135 hit the real
    # 404 on a retry, so two attempts weren't enough; the pause spaces them out in case 404s
    # cluster.
    - id: first
      continue-on-error: true
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}.temporary-no-such-file # TEMPORARY: forces the next attempt
        reporter: ${{ inputs.reporter }}
        use-actions-summary: "false" # a check run with annotations on the failing line
        fail-on-error: "false"
    - name: Pause before the second attempt
      if: ${{ steps.first.outcome == 'failure' }}
      shell: bash
      run: sleep 10
    - id: second
      if: ${{ steps.first.outcome == 'failure' }}
      continue-on-error: true
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}.temporary-no-such-file # TEMPORARY: forces the next attempt
        reporter: ${{ inputs.reporter }}
        use-actions-summary: "false"
        fail-on-error: "false"
    - name: Pause before the third attempt
      if: ${{ steps.second.outcome == 'failure' }}
      shell: bash
      run: sleep 10
    # No continue-on-error: failing three times fails the job, as a single failure did before.
    - id: third
      if: ${{ steps.second.outcome == 'failure' }}
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        reporter: ${{ inputs.reporter }}
        use-actions-summary: "false"
        fail-on-error: "false"
