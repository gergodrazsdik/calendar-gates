name: Test report
description: >-
  Publish test results as a check run with annotations on the failing line (dorny/test-reporter),
  retried once. GitHub sometimes answers 404 to the check-run update that follows the create by
  half a second (dorny/test-reporter#866); the action tries that update once, so a passing run
  went red and left its check run in_progress for good. The test step is the gate: it fails the
  job on a failing test by its own exit code. This action only reports. Drop the retry once
  upstream ships one.
inputs:
  name:
    description: Name of the check run
    required: true
  path:
    description: Report file(s), glob allowed
    required: true
  reporter:
    description: Report format (dotnet-trx, java-junit, ...)
    required: true
runs:
  using: composite
  steps:
    # fail-on-error false: a failing test already fails the job in the test step, so this step
    # fails only when *reporting* fails (API error, missing or unparsable report), and a genuine
    # test failure doesn't post its report twice.
    - id: first
      continue-on-error: true
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        reporter: ${{ inputs.reporter }}
        use-actions-summary: "false" # a check run with annotations on the failing line
        fail-on-error: "false"
    # The retry creates a new check run of the same name. No continue-on-error: failing twice
    # fails the job, as a single failure did before.
    - id: retry
      if: ${{ steps.first.outcome == 'failure' }}
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        reporter: ${{ inputs.reporter }}
        use-actions-summary: "false"
        fail-on-error: "false"
    # The first attempt's check run was created but never completed. Best effort: a failure here
    # leaves a stale in_progress check run (not a required check), as before, and fails nothing.
    - name: Complete the first attempt's check run
      if: ${{ steps.first.outcome == 'failure' && steps.retry.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        # The SHA dorny/test-reporter reports to: the PR head on pull_request, else the run's.
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        CHECK_NAME: ${{ inputs.name }}
        SUMMARY: >-
          The update of this check run failed (dorny/test-reporter#866); the retry posted the
          report under the same name.
      run: |
        # The retry's check run is already completed, so every in_progress one by this name is an
        # orphan of a failed attempt.
        ids=$(gh api -X GET "repos/$REPO/commits/$SHA/check-runs" \
          -f check_name="$CHECK_NAME" -f status=in_progress --jq '.check_runs[].id') || {
          echo "::warning::could not list check runs named '$CHECK_NAME'"; exit 0; }
        for id in $ids; do
          gh api -X PATCH "repos/$REPO/check-runs/$id" -f conclusion=neutral \
            -f 'output[title]=Superseded by a retry' \
            -f "output[summary]=$SUMMARY" \
            > /dev/null || echo "::warning::could not complete check run $id"
        done
