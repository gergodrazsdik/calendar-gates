name: Set up .NET environment
description: >-
  .NET SDK from global.json, NuGet package cache keyed on the lock files,
  and the local tools from .config/dotnet-tools.json (CSharpier, MinVer CLI).
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "**/packages.lock.json"
    - name: Restore local tools
      shell: bash
      run: dotnet tool restore
