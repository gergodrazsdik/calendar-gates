# Categories for generated release notes (gh release create --generate-notes), by PR label.
changelog:
  exclude:
    labels: [llm-compare]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
