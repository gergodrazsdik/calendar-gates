# `/llm-*` PR comment commands (docs/PLAN-v2.md Phase 16, tools/llm-gate/src/llm_gate/feedback.py):
#   /llm-fp <finding-id> <reason>    a false positive; marks the finding in the sticky comment
#   /llm-ack <finding-id>            a true positive (the denominator for the false-positive rate)
#   /llm-override <reason>           adds llm-override and re-runs llm-review
#   /llm-risk <low|medium|high> <reason>   manual triage risk; re-runs llm-review (ADR 0008)
#
# Trust: issue_comment always runs this file and the llm-gate code from the default branch, and the
# PR is never checked out. Outsiders don't start the job at all (author_association below), and
# within it only people with a write, maintain or admin role are heard (the permission API:
# MEMBER and COLLABORATOR don't imply write access). The comment is untrusted: llm-gate reads it
# from the event file, and what reaches a shell is llm-gate's validated output (paths, ids,
# logins) through env. GH_TOKEN is set only for the steps that call the API.
name: llm-feedback

on:
  issue_comment:
    types: [created]

permissions: {}

# No concurrency group: GitHub keeps only one pending run per group and cancels the rest, which
# would drop commands. Every command writes its own file; labels and reactions are idempotent.

jobs:
  feedback:
    name: llm-feedback
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/llm-')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the record on the audit-log branch
      issues: write # the label
      actions: write # re-run llm-review after /llm-override and /llm-risk
      pull-requests: write # reactions to and edits of PR comments, the label, the PR's head
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: llm-gate from the default branch (the PR is never checked out)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: tools/llm-gate/uv.lock

      - name: The audit log, read-only (to check that a finding belongs to this PR)
        run: |
          git fetch --quiet --no-tags --depth 1 origin audit-log
          mkdir -p "$RUNNER_TEMP/audit-log"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/audit-log"

      - name: The commenter's repository role
        id: role
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.event.comment.user.login }}
        run: |
          role=$(gh api "repos/$REPO/collaborators/$LOGIN/permission" --jq .role_name 2> /dev/null \
            || echo none)
          echo "role=$role" >> "$GITHUB_OUTPUT"

      - name: Validate the command
        id: handle
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE: ${{ steps.role.outputs.role }}
        run: |
          # The PR's head when the command arrived: a /llm-risk that *lowers* the level applies to
          # that head only, so one early `low` can't leave every later push unreviewed (F020).
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          uv run --project tools/llm-gate --locked llm-gate feedback handle \
            --event "$GITHUB_EVENT_PATH" --audit-dir "$RUNNER_TEMP/audit-log" \
            --permission "$ROLE" --head-sha "$head" \
            --out "$RUNNER_TEMP/out" > "$RUNNER_TEMP/actions.json"
          jq -r '"path=\(.path)", "reaction=\(.reaction // "")", "label=\(.label // "")",
            "rerun=\(.rerun)", "command=\(.message)", "mark_check=\(.mark.check // "")",
            "mark_finding=\(.mark.finding_id // "")", "mark_by=\(.mark.by // "")"' \
            "$RUNNER_TEMP/actions.json" >> "$GITHUB_OUTPUT"
          jq -r '"llm-feedback: \(.message) (recorded: \(.recorded))"' "$RUNNER_TEMP/actions.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write the record to audit-log
        if: steps.handle.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ steps.handle.outputs.path }}
        run: |
          [[ "$RECORD" =~ ^events/[0-9]{4}/[0-9]{2}/[0-9]{2}/feedback-[a-z0-9-]+\.jsonl$ ]] || {
            echo "::error::unexpected record path: $RECORD"; exit 1; }
          # Append-only: an existing file is never overwritten (outsiders: one per PR, person, day).
          if gh api "repos/$REPO/contents/$RECORD?ref=audit-log" --silent 2> /dev/null; then
            echo "$RECORD exists already, skipped"
            exit 0
          fi
          body=$(jq -n --arg message "feedback: PR #$PR, comment $COMMENT_ID" \
            --rawfile content <(base64 -w0 "$RUNNER_TEMP/out/$RECORD") \
            '{message: $message, content: $content, branch: "audit-log"}')
          for try in 1 2 3 4 5; do # the collector may move the branch head meanwhile (409)
            if gh api -X PUT "repos/$REPO/contents/$RECORD" --input - --silent <<< "$body"; then
              echo "wrote $RECORD"
              exit 0
            fi
            sleep $((try * 3 + RANDOM % 5))
          done
          exit 1

      - name: React
        if: steps.handle.outputs.reaction != ''
        continue-on-error: true # feedback for the person; never blocks the label or the re-run
        env:
          GH_TOKEN: ${{ github.token }}
          REACTION: ${{ steps.handle.outputs.reaction }}
        run: gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="$REACTION" --silent

      - name: Add the override label
        if: steps.handle.outputs.label != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.handle.outputs.label }}
        run: gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$LABEL" --silent

      - name: Mark the false positive in the sticky comment
        if: steps.handle.outputs.mark_finding != ''
        continue-on-error: true # cosmetic: the record is what counts
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK: ${{ steps.handle.outputs.mark_check }}
          FINDING: ${{ steps.handle.outputs.mark_finding }}
          BY: ${{ steps.handle.outputs.mark_by }}
        run: |
          marker="<!-- llm-gate:$CHECK -->"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[]' \
            | jq -r --arg marker "$marker" \
              'select(.user.login == "github-actions[bot]" and (.body | startswith($marker))) | .id' \
            | tail -n 1)
          [ -n "$id" ] || { echo "no sticky comment for $CHECK"; exit 0; }
          gh api "repos/$REPO/issues/comments/$id" --jq .body > "$RUNNER_TEMP/body.md"
          if uv run --project tools/llm-gate --locked llm-gate feedback mark \
              --body-file "$RUNNER_TEMP/body.md" --finding "$FINDING" --by "$BY" > "$RUNNER_TEMP/marked.md"; then
            jq -n --rawfile body "$RUNNER_TEMP/marked.md" '{body: $body}' \
              | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - --silent
          fi

      # Labels added with GITHUB_TOKEN start no workflows, so the review is re-run explicitly. Its
      # override step reads the labels from the API, and triage reads /llm-risk from audit-log;
      # the results come from its cache. A run still in flight is waited for, because it has
      # already read both (F044, docs/v2-review-findings.md).
      - name: Re-run llm-review
        if: steps.handle.outputs.rerun == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ steps.handle.outputs.command }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          read -r run status < <(gh api \
            "repos/$REPO/actions/workflows/llm-review.yml/runs?head_sha=$head&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.status)"')
          if [ -z "${run:-}" ] || [ "$run" = null ]; then
            echo "::notice title=llm-feedback::No llm-review run for $head yet; the label is set."
            exit 0
          fi
          # A run in flight has already read what this command changes: triage read /llm-risk from
          # audit-log when it started, and each llm job read the labels before reviewing. Waiting
          # for it and re-running is the only way the command reaches the review (F044); the
          # rerun API refuses a run that is still going.
          waited=0
          while [ "$status" != completed ] && [ "$waited" -lt 420 ]; do
            sleep 15
            waited=$((waited + 15))
            status=$(gh api "repos/$REPO/actions/runs/$run" --jq .status)
          done
          if [ "$status" != completed ]; then
            {
              echo "\`/llm-$COMMAND\` is recorded, but llm-review run $run was still going"
              echo "after 7 minutes, so that review does not include it. Re-run llm-review, or"
              echo "push a commit, to apply it."
            } > "$RUNNER_TEMP/late.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/late.md"
            echo "::warning title=llm-feedback::run $run still $status after ${waited}s; told the PR."
            exit 0
          fi
          gh api -X POST "repos/$REPO/actions/runs/$run/rerun" --silent
          echo "re-ran llm-review run $run after ${waited}s"
