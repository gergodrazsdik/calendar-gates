# Reusable: restore, build and test the solution. Used by ci.yml and release.yml.
# The caller's job name is prefixed to the check name: `build-test / dotnet`.
name: dotnet

on:
  workflow_call:

permissions: {}

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write # test report check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer reads the version from tags
          persist-credentials: false

      - uses: ./.github/actions/setup-dotnet-env

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: >-
          dotnet test --no-build -c Release --results-directory TestResults --
          --report-trx --coverage --coverage-output-format cobertura

      - name: Test report
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-report # check run with annotations, up to 3 attempts (#866)
        with:
          name: test results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: python3 scripts/coverage-summary.py TestResults/*.cobertura.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
