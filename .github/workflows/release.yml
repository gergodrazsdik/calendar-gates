# Release pipeline (docs/PLAN.md Phase 11, ADR 0009). `just release X.Y.Z` pushes a signed tag
# vX.Y.Z; this workflow verifies it and re-runs the tests, then builds the multi-arch image **once**
# and pushes it by digest (tag `candidate-vX.Y.Z` only), scans that digest, and attests provenance,
# SBOM, the vulnerability scan and the LLM review of the release's PRs on it. Approval in the
# `release` environment records itself as an attestation and publishes nothing; then
# `admission-smoke` proves Kyverno admits those bytes and denies an unattested image (ADR 0010)
# while `smoke` runs the digest and the contract tests against it. Only when both pass does
# `promote` give the digest its version tags (`X.Y.Z`, `X.Y`), push the chart the admission tests
# installed, and publish the GitHub Release — so a failed test leaves nothing public behind and the
# version isn't burnt (F071). Attestations are signed keyless and logged in the public Rekor log:
# releases only (ADR 0009).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
      previous: ${{ steps.tag.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is SemVer, annotated, signed and on main
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]"; exit 1
          fi
          version=${BASH_REMATCH[1]}
          # Ask GitHub, not the local clone: checkout can turn an annotated tag into a lightweight one.
          read -r type sha < <(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"')
          if [ "$type" != tag ]; then
            echo "::error::$TAG is a lightweight tag; release tags are annotated and signed (git tag -s)"; exit 1
          fi
          read -r verified reason < <(gh api "repos/$REPO/git/tags/$sha" \
            --jq '"\(.verification.verified) \(.verification.reason)"')
          if [ "$verified" != true ]; then
            echo "::error::the signature of $TAG is not verified by GitHub ($reason)"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # The previous release: the range the llm-review attestation covers. A final release is
          # measured against the previous final one, so PRs released only in a prerelease count.
          exclude=()
          [[ $version == *-* ]] || exclude=(--exclude '*-*')
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${exclude[@]}" "$GITHUB_SHA^" \
            2> /dev/null || true)
          [[ -z $previous || $previous =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || previous=""
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $GITHUB_SHA (tag signature: $reason)" >> "$GITHUB_STEP_SUMMARY"

  build-test:
    name: build-test
    needs: verify
    permissions:
      contents: read
      checks: write # test report check run in _dotnet.yml
    uses: ./.github/workflows/_dotnet.yml


  # Built once: every later job uses this digest. Only the candidate tag exists before approval;
  # `sha-<short>` belongs to ci.yml's edge images, and a second build of the same commit would
  # overwrite it with different bytes.
  build:
    name: build
    needs: [verify, build-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # the candidate image on ghcr.io
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=candidate-${{ github.ref_name }}
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
      # The final Dockerfile stage has no RUN, so arm64 builds without QEMU.
      - name: Build and push by digest (amd64 + arm64, buildkit SBOM and provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            COMMIT=${{ needs.verify.outputs.commit }}
          sbom: true
          provenance: mode=max
          # No build cache here: nothing another run wrote can end up in a release.
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest"; exit 1; }
          echo "Built \`$IMAGE@$DIGEST\` (candidate-$GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

  # The pushed bytes, per platform: the same grype config and threshold as pull requests.
  scan:
    name: scan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the candidate, also while the package is private
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          grype-version: v0.120.1
      - name: Vulnerability gate on the candidate (amd64 and arm64)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          mkdir -p scan
          status=0
          for arch in amd64 arm64; do
            "$GRYPE" "registry:$IMAGE@$DIGEST" --platform "linux/$arch" --config .grype.yaml \
              -o "json=scan/grype-$arch.json" -o "table=scan/grype-$arch.txt" || status=1
            { echo "### grype linux/$arch: $IMAGE@$DIGEST"; echo '```'; cat "scan/grype-$arch.txt"; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype
          path: scan/grype-*.json
          retention-days: 90

  # Four attestations on the one digest, each a permanent entry in the public Rekor log
  # (keyless, Sigstore public-good: this is a public repository). Releases only (ADR 0009).
  attest:
    name: attest
    needs: [verify, build, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # attestations are pushed next to the image
      id-token: write # keyless signing
      attestations: write # the repository's attestation store
      artifact-metadata: write # storage records for the pushed attestations
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      VERSION: ${{ needs.verify.outputs.version }}
      PREVIOUS: ${{ needs.verify.outputs.previous }}
      TAG: ${{ github.ref_name }}
      NODE_OPTIONS: "--max-http-header-size=32768" # as actions/attest-build-provenance sets it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits since the previous release
          persist-credentials: false
      # No cache in the signing job: nothing another run wrote may run here (as in build).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grype
          path: ${{ runner.temp }}/grype
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Predicates (vuln-scan, llm-review) and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          git fetch --quiet --no-tags --depth 1 origin audit-log
          mkdir -p "$RUNNER_TEMP/audit-log" && git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/audit-log"
          scripts/release-commits.sh "$PREVIOUS" "$GITHUB_SHA" > "$RUNNER_TEMP/commits.json"
          gate=(uv run --project tools/llm-gate --locked llm-gate)
          "${gate[@]}" attest vuln-scan --grype "$RUNNER_TEMP/grype/grype-amd64.json" \
            --grype "$RUNNER_TEMP/grype/grype-arm64.json" --out "$RUNNER_TEMP/out/vuln-scan.json"
          "${gate[@]}" attest llm-review --from "$PREVIOUS" --to "$TAG" \
            --commits "$RUNNER_TEMP/commits.json" --audit-dir "$RUNNER_TEMP/audit-log" \
            --out "$RUNNER_TEMP/out/llm-review.json" --notes "$RUNNER_TEMP/out/release-notes.md"
          cat "$RUNNER_TEMP/out/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: SPDX SBOM (also a release asset)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ runner.temp }}/out/sbom.spdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: ${{ runner.temp }}/out/sbom.spdx.json
          push-to-registry: true
      - name: Attest the vulnerability scan
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          predicate-type: https://github.com/gergodrazsdik/calendar-gates/attestations/vuln-scan/v1
          predicate-path: ${{ runner.temp }}/out/vuln-scan.json
          push-to-registry: true
      - name: Attest the LLM review
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          predicate-type: https://github.com/gergodrazsdik/calendar-gates/attestations/llm-review/v1
          predicate-path: ${{ runner.temp }}/out/llm-review.json
          push-to-registry: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/out/
          retention-days: 90

  # Pauses for approval: the `release` environment has a required reviewer and only allows v* tags.
  # Nothing public happens here. The approval is recorded as an attestation on the digest, which is
  # what admission requires (ADR 0010) and what lets the later jobs run at all; the version tags,
  # the chart and the GitHub Release come after the smoke tests pass (F071).
  approve:
    name: approve
    needs: [verify, build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write # the attestation is pushed next to the image
      id-token: write # keyless signing of the approval attestation
      attestations: write # the repository's attestation store
      artifact-metadata: write # storage records for the pushed attestation
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The one attestation that can only exist after a person approved this job's environment, so
      # admission can tell an approved release from a candidate that was built, scanned and
      # attested and then rejected (F048, ADR 0010). The other four are made in `attest`, before
      # the gate, on purpose: the approver sees bytes that are already attested (ADR 0009).
      - name: Attest the approval
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          predicate-type: https://github.com/gergodrazsdik/calendar-gates/attestations/release-approved/v1
          # yamllint disable rule:line-length
          predicate: >-
            {"version": "${{ needs.verify.outputs.version }}",
             "tag": "${{ github.ref_name }}",
             "approved_in": "release",
             "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"}
          # yamllint enable rule:line-length
          push-to-registry: true
      - name: Summary
        run: |
          {
            echo "### Approved $VERSION"
            echo "- digest: \`$DIGEST\`"
            echo "- the version tags and the chart follow the smoke tests (ADR 0009)"
          } >> "$GITHUB_STEP_SUMMARY"
  # Admission control (ADR 0010): Kyverno with the project's policies on a throwaway kind cluster.
  # The release must be admitted in `calendar-gates`; the unattested edge image and a foreign image
  # must be denied; `calendar-gates-dev` must admit edge and report it. Nothing is published until
  # this and `smoke` pass (F071), so the chart is packaged here and installed from the tarball; the
  # same tarball is what `promote` pushes, so the bytes that were tested are the bytes released.
  admission-smoke:
    name: admission-smoke
    needs: [verify, build, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DIGEST: ${{ needs.build.outputs.digest }}
      # Pinned so the test can't drift; it is only ever refused (a server-side dry run, never pulled).
      FOREIGN: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2
      # The project cluster's definition (node image pinned by digest; Kubernetes 1.35 for Kyverno 1.19).
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: v0.33.0
          kubectl_version: v1.35.8
          config: deploy/kind/cluster.yaml
          cluster_name: calendar-gates
      - name: Kyverno (chart pinned by sha256, images by digest)
        run: |
          file=$(awk '{print $2}' deploy/kyverno/chart.sha256)
          version=${file#kyverno-}; version=${version%.tgz}
          helm pull kyverno --repo https://kyverno.github.io/kyverno/ --version "$version" -d "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && sha256sum -c --quiet) < deploy/kyverno/chart.sha256
          helm install kyverno "$RUNNER_TEMP/$file" -n kyverno --create-namespace \
            -f deploy/kyverno/values.yaml --wait --timeout 5m
      - name: Policies (both namespaces), ready
        run: |
          # `--wait` returns when the Kyverno deployment is Ready, which is not when its admission
          # webhook is serving: the policy-validation webhook refused connections on both of
          # v0.3.4's attempts ("dial tcp …:443: connect: connection refused") while v0.3.3 happened
          # to win the race. Wait for the service to have an endpoint, then retry the apply, since
          # the webhook can still be a moment behind its endpoints.
          kubectl -n kyverno wait --for=jsonpath='{.subsets[*].addresses[0].ip}' \
            endpoints/kyverno-svc --timeout=2m
          for attempt in $(seq 30); do
            kubectl apply -k deploy/policies && break
            [ "$attempt" = 30 ] && { echo "::error::the policies never applied"; exit 1; }
            sleep 4
          done
          for _ in $(seq 60); do
            pending=$(kubectl get validatingpolicies,imagevalidatingpolicies -o json \
              | jq '[.items[] | select(.status.conditionStatus.ready != true)] | length')
            [ "$pending" = 0 ] && break
            sleep 2
          done
          kubectl get validatingpolicies,imagevalidatingpolicies
          [ "$pending" = 0 ] || { echo "::error::$pending policies are not ready"; exit 1; }
      - name: Package the chart, pinned to the digest
        run: |
          yq -i ".image.digest = \"$DIGEST\"" deploy/helm/calendar-gates/values.yaml
          helm package deploy/helm/calendar-gates --version "$VERSION" --app-version "$VERSION" -d dist
      - name: The release is admitted in calendar-gates
        run: |
          helm install calendar-gates "dist/calendar-gates-$VERSION.tgz" \
            -n calendar-gates --wait --timeout 4m
          kubectl -n calendar-gates get pods -o wide
          running=$(kubectl -n calendar-gates get pods -o jsonpath='{.items[*].spec.containers[*].image}')
          for image in $running; do
            [[ $image == *"@$DIGEST" ]] || { echo "::error::$image is not the release digest $DIGEST"; exit 1; }
          done
      - name: Unattested and foreign images are denied in calendar-gates
        run: |
          # Each image policy has its own webhook, called in parallel: an image that fails several
          # Deny policies may be refused by any one of them first, so the check takes a regex.
          refused() { # pod name, image, the policy (an ERE) that must refuse it
            if out=$(kubectl -n calendar-gates run "$1" --image="$2" --restart=Never --dry-run=server 2>&1); then
              echo "::error::$2 was admitted in calendar-gates"; exit 1
            fi
            echo "$out"
            grep -qE "Policy ($3) failed" <<< "$out" || { echo "::error::$2 was not refused by $3"; exit 1; }
          }
          # All three attestation policies deny `edge`, and their webhooks are called in parallel,
          # so any one of them can be the one that answers first. `calendar-gates-approved` has
          # been in that set since it went Deny in v0.3.2 (#71) but wasn't listed here, which made
          # this assertion a race: v0.3.3 failed on it after refusing the image correctly.
          unattested='calendar-gates-release|calendar-gates-llm-review|calendar-gates-approved'
          refused edge "$IMAGE:edge" "$unattested"
          refused foreign "$FOREIGN" calendar-gates-images
          # An unattested image hidden in an init container, next to the attested release.
          if out=$(kubectl create --dry-run=server -f - 2>&1 <<EOF
          apiVersion: v1
          kind: Pod
          metadata: {name: init-edge, namespace: calendar-gates}
          spec:
            initContainers: [{name: sneak, image: "$IMAGE:edge"}]
            containers: [{name: app, image: "$IMAGE@$DIGEST"}]
          EOF
          ); then
            echo "::error::an edge init container was admitted in calendar-gates"; exit 1
          fi
          echo "$out"
          grep -qE "Policy ($unattested) failed" <<< "$out" \
            || { echo "::error::the edge init container was not refused by $unattested"; exit 1; }
      - name: calendar-gates-dev admits edge and reports it
        run: |
          kubectl -n calendar-gates-dev run edge --image="$IMAGE:edge" --restart=Never
          for _ in $(seq 30); do
            found=$(kubectl -n calendar-gates-dev get policyreports -o json | jq -r '[.items[]
              | select(.scope.name == "edge") | .results[]?
              | select(.policy == "calendar-gates-release-dev" and .result == "fail")] | length')
            [ "${found:-0}" -gt 0 ] && break
            sleep 2
          done
          [ "${found:-0}" -gt 0 ] || { echo "::error::no PolicyReport failure for edge in calendar-gates-dev"; exit 1; }
          echo "calendar-gates-dev: edge admitted, reported as failing calendar-gates-release-dev"
      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "### admission-smoke diagnostics"
            echo '```'
            kubectl get validatingpolicies,imagevalidatingpolicies -o wide 2>&1 || true
            kubectl get pods -A 2>&1 || true
            kubectl -n calendar-gates get events --sort-by=.lastTimestamp 2>&1 | tail -n 30 || true
            kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=60 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The exact tarball these tests admitted, for `promote` to push: not a second packaging run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: dist/calendar-gates-*.tgz
          retention-days: 7

  # The release digest as a running service. It needs nothing that `promote` creates, so it runs
  # before it: a failed smoke used to leave the version tags, the chart and a draft release behind,
  # which burnt the version (F071).
  smoke:
    name: smoke
    needs: [verify, build, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the image by digest, also while the package is private
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # scan already checked these exact bytes (the digest); this runs them.
      - name: Run the published image (pulled from GHCR)
        run: |
          docker run -d --name calendar-gates -p 8081:8080 "$IMAGE@$DIGEST"
          scripts/wait-for-health.sh http://localhost:8081/health 60
      - name: /api/version reports the tag
        run: |
          reported=$(curl -fsS http://localhost:8081/api/version | jq -r .version)
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::the image reports version $reported, the tag says $VERSION"; exit 1
          fi
      - name: Contract tests
        run: |
          ijhttp=docker.io/jetbrains/intellij-http-client:261.25134.95@sha256:1fdeab28e7eacac2ec8e0564499248452e29c55c380497eb92088bd49cfc3096
          docker run --rm --network host -v "$PWD:/workdir" "$ijhttp" \
            --no-progress -v http/http-client.env.json -e docker http/calendar.http
      - name: Container logs
        if: failure()
        run: docker logs calendar-gates

  # Everything public, and only now: the version tags, the chart the admission tests installed, and
  # the GitHub Release. No `environment:` here, so there is no second approval pause — this job can
  # only run because `approve` already passed its gate, and the approval is attested on the digest.
  promote:
    name: promote
    needs: [verify, build, attest, approve, admission-smoke, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the GitHub Release
      packages: write # version tags and the chart on ghcr.io
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the attested digest to the version tags
        run: |
          # X.Y.Z is never moved: a re-run that built new bytes must not take over the version.
          if existing=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
              --format '{{.Manifest.Digest}}' 2> /dev/null); then
            if [ "$existing" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$VERSION is already $existing; this run built $DIGEST. Release a new version."
              exit 1
            fi
          fi
          tags=(-t "$IMAGE:$VERSION")
          # X.Y only for final versions, as docker/metadata-action's semver patterns did.
          [[ $VERSION == *-* ]] || tags+=(-t "$IMAGE:${VERSION%.*}")
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
          for tag in "${tags[@]}"; do
            [ "$tag" = -t ] && continue
            got=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "::error::$tag is $got, not $DIGEST"; exit 1; }
          done
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2
      - name: Push the chart the admission tests installed
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          helm registry login ghcr.io -u "$ACTOR" --password-stdin <<< "$GH_TOKEN"
          helm push "dist/calendar-gates-$VERSION.tgz" "$CHART_REPO"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          assets=("$RUNNER_TEMP/out/sbom.spdx.json" "dist/calendar-gates-$VERSION.tgz")
          {
            echo "Image: \`$IMAGE:$VERSION\` (\`$DIGEST\`). Verify: \`just verify-release $VERSION\`."
            echo
            cat "$RUNNER_TEMP/out/release-notes.md"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            # A re-run of this job only: the release exists, refresh its assets and notes (the
            # generated changelog is added again, as --generate-notes does on create).
            gh release upload "$TAG" -R "$REPO" --clobber "${assets[@]}"
            { echo; gh api -X POST "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body; } \
              >> "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" -R "$REPO" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
          else
            prerelease=()
            [[ $VERSION == *-* ]] && prerelease=(--prerelease)
            # Not a draft: the tests that used to decide whether to publish it have already run.
            gh release create "$TAG" -R "$REPO" --verify-tag --generate-notes \
              --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG" "${prerelease[@]}" "${assets[@]}"
          fi
          {
            echo "### Released $VERSION"
            echo "- image: \`$IMAGE:$VERSION\` (\`$DIGEST\`)"
            echo "- chart: \`$CHART_REPO/calendar-gates --version $VERSION\` (pinned to the digest)"
          } >> "$GITHUB_STEP_SUMMARY"
