# CodeQL advanced setup (ADR 0012): C# is scanned from a real build, because build-mode none left it
# below CodeQL's analysis-quality thresholds. Not a required check. Default setup has to stay off in
# the repository settings: GitHub rejects uploads from this workflow while it is on.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer reads the version from tags
          persist-credentials: false

      # Before init, so that only the solution's own build is traced.
      - if: ${{ matrix.build-mode == 'manual' }}
        uses: ./.github/actions/setup-dotnet-env

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: ${{ matrix.build-mode == 'manual' }}
        run: |
          dotnet restore --locked-mode
          dotnet build --no-restore -c Release

      # The same categories as default setup used, so the analyses continue under one identity.
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
