# LLM review gates (docs/gates.md, ADR 0002). One job per check in tools/llm-gate/checks.yaml,
# each reported as `llm / <check>`. The verdict comes from llm-gate, never from the model. The
# `triage` job's risk level decides which of them review, block, and with what (ADR 0008).
# Separate from ci.yml so that adding or removing a label re-runs only these checks.
#
# ADR 0004: the gate (tools/llm-gate, checks.yaml, the prompts, the comment script) runs from the
# **base branch as it is now**, checked out into gate/. Not the PR's base.sha: GitHub doesn't move
# that when the base branch moves on, so a long-open PR would keep an old gate. triage resolves
# the commit once and every check of the run uses it. The PR head is checked out into src/ and is only
# data: the diff, and read-only context for the agent engine. A PR can't weaken or instruct the
# gate that reviews it. Remaining hole: this workflow file itself comes from the PR.
#
# ADR 0005: every check appends an audit record (.llm-gate/audit.jsonl) and uploads it as
# audit-<run>-<attempt>-<check> (triage: -triage); audit-collect.yml (default branch) validates
# it into audit-log.
name: llm-review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: llm-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Triage (ADR 0008): the PR's risk from deterministic rules (paths, size, AI-assisted), raised
  # by a cheap model if it disagrees, or a recorded `/llm-risk` (from audit-log, never labels).
  # The risk decides which checks run, which block, and their engine and model; every check
  # still reports below, so no required check goes missing.
  triage:
    name: triage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the risk:<level> and ai-assisted labels
    outputs:
      gate_sha: ${{ steps.gate.outputs.sha }}
      risk: ${{ steps.triage.outputs.risk }}
    env:
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      LLM_GATE_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Gate tooling from the base branch's current head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: gate
          persist-credentials: false
      - name: Pin the gate commit for this run
        id: gate
        run: echo "sha=$(git -C gate rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: The PR head (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: src
          fetch-depth: 0 # the diff is taken from the merge base with origin/<base>
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: gate/tools/llm-gate/uv.lock
      # The description from the API, not the event: a re-run (after /llm-risk) keeps the
      # original payload. The commits from the checkout, as the collector gets them from the
      # compare API for this head: a later push can't change what this run is checked against.
      - name: The PR's commits and description, and manual risk changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          gh api "repos/$REPO/pulls/$PR" --jq '{body, head_ref: .head.ref}' > "$RUNNER_TEMP/pr.json"
          git -C src log -z --format=%B "origin/$BASE_REF..HEAD" \
            | jq -Rs 'split("\u0000") | map(select(length > 0))' > "$RUNNER_TEMP/commits.json"
          jq --slurpfile commits "$RUNNER_TEMP/commits.json" '. + {commits: $commits[0]}' \
            "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-data.json"
          mkdir -p "$RUNNER_TEMP/audit-log"
          if git -C gate fetch --quiet --no-tags --depth 1 origin audit-log; then
            git -C gate archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/audit-log"
          fi

      # The triage cache stays, unlike the review one (F002): a forged entry here can only raise
      # the model's risk (the rules' floor dominates, triage.py), and the collector recomputes the
      # floor and checks final_risk against it anyway.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .llm-gate/cache
          key: llm-gate-triage-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: llm-gate-triage-pr${{ github.event.pull_request.number }}-

      # Without a key (forks, Dependabot) the rules alone decide; the model can only raise.
      # A base branch whose gate has no triage yet (the PR that introduces it, an old base)
      # gives no risk: every check then runs as checks.yaml configures it, as before triage.
      - name: Triage
        id: triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL_CHEAP: ${{ vars.LLM_MODEL_CHEAP }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          gate=(uv run --project gate/tools/llm-gate --locked llm-gate
            --repo src --config gate/tools/llm-gate/checks.yaml)
          if ! "${gate[@]}" triage --help > /dev/null 2>&1; then
            echo "::notice title=triage::The base branch's llm-gate has no triage; every check runs as configured."
            echo "risk=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          no_model=()
          [ -n "$ANTHROPIC_API_KEY" ] || no_model=(--no-model)
          "${gate[@]}" triage --base "origin/$BASE_REF" --pr-data "$RUNNER_TEMP/pr-data.json" \
            --audit-dir "$RUNNER_TEMP/audit-log" --out "$GITHUB_WORKSPACE/.llm-gate" "${no_model[@]}" \
            > "$RUNNER_TEMP/triage.json"
          risk=$(jq -r '.risk // empty' "$RUNNER_TEMP/triage.json")
          if [ -z "$risk" ]; then
            echo "::notice title=triage::checks.yaml has no triage section; every check runs as configured."
            echo "risk=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .llm-gate/triage.md >> "$GITHUB_STEP_SUMMARY"
          [[ "$risk" =~ ^(low|medium|high)$ ]] || { echo "::error::triage returned no risk"; exit 1; }
          echo "risk=$risk" >> "$GITHUB_OUTPUT"
          echo "ai=$(jq -r .ai_assisted "$RUNNER_TEMP/triage.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.triage.outcome == 'success'
        with:
          path: .llm-gate/cache
          key: llm-gate-triage-pr${{ github.event.pull_request.number }}-${{ github.sha }}

      - name: Upload the audit record
        if: always() && hashFiles('.llm-gate/audit.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-${{ github.run_id }}-${{ github.run_attempt }}-triage
          path: .llm-gate/audit.jsonl
          retention-days: 7
          if-no-files-found: ignore

      # Labels set with GITHUB_TOKEN start no workflow runs (no loop). A person's risk:* label
      # does start one, and triage puts its own back: only /llm-risk changes the risk.
      - name: Labels
        if: steps.triage.outputs.risk != ''
        continue-on-error: true # a fork PR's token is read-only; the risk is in the outputs
        env:
          GH_TOKEN: ${{ github.token }}
          RISK: ${{ steps.triage.outputs.risk }}
          AI: ${{ steps.triage.outputs.ai }}
        run: |
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          for label in risk:low risk:medium risk:high; do
            if [ "$label" != "risk:$RISK" ] && grep -qx "$label" <<< "$labels"; then
              gh api -X DELETE "repos/$REPO/issues/$PR/labels/$label" --silent
            fi
          done
          grep -qx "risk:$RISK" <<< "$labels" \
            || gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=risk:$RISK" --silent
          if [ "$AI" = true ]; then
            grep -qx ai-assisted <<< "$labels" \
              || gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=ai-assisted" --silent
          elif grep -qx ai-assisted <<< "$labels"; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/ai-assisted" --silent
          fi

  llm:
    name: llm / ${{ matrix.check }}
    needs: triage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # sticky review comment
      issues: read # who added llm-override, and their /llm-override reason
    strategy:
      fail-fast: false
      # A literal list, not `fromJSON(needs.triage.outputs.checks)`: a matrix built from a
      # dependency's output can't expand until that job finishes, so a run cancelled during triage
      # — which is what happens when two pushes land a second apart, as Dependabot does — left a
      # check literally named `llm / ${{ matrix.check }}` behind, failed and for ever, because no
      # later run ever reports that context. With the names known at run start, the cancelled run's
      # checks share their names with the next run's and are superseded.
      # scripts/check-ruleset-consistency.py keeps this list equal to checks.yaml's checks.
      matrix:
        check:
          - code-review
          - security-review
          - test-review
          - api-contract
          - docs-drift
          - workflow-review
    env:
      CHECK: ${{ matrix.check }}
      PR: ${{ github.event.pull_request.number }}
      # Audit context (llm-gate reads these by name; ADR 0005).
      LLM_GATE_PR: ${{ github.event.pull_request.number }}
      LLM_GATE_PR_EVENT_AT: ${{ github.event.pull_request.updated_at }}
      # The PR's triage risk (ADR 0008): llm-gate decides from it whether this check is needed,
      # blocks, and with which engine and model (checks.yaml triage.levels).
      LLM_GATE_RISK: ${{ needs.triage.outputs.risk }}
    steps:
      - name: Gate tooling, the commit triage pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.triage.outputs.gate_sha }}
          path: gate
          persist-credentials: false
      - name: The PR head (data and read-only context only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: src
          fetch-depth: 0 # the diff is taken from the merge base with origin/<base>
          persist-credentials: false
      - name: Show what runs and what is reviewed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "gate: tools/llm-gate and prompts from $(git -C gate rev-parse HEAD) ($BASE_REF now)"
          echo "src:  reviewed PR head $(git -C src rev-parse HEAD)"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: gate/tools/llm-gate/uv.lock

      # Fork and Dependabot PRs get no secrets on pull_request. By default the checks report that
      # and pass; with the repo variable LLM_GATE_MISSING_KEY=fail they run anyway and the
      # blocking ones fail closed (gate drill 9).
      - name: API key available?
        id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          MISSING_KEY: ${{ vars.LLM_GATE_MISSING_KEY }}
        run: |
          if [ "$HAS_KEY" = true ] || [ "$MISSING_KEY" = fail ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            reason="No ANTHROPIC_API_KEY for this PR (fork or Dependabot); the LLM review did not run."
            echo "::notice title=llm / $CHECK skipped::$reason"
            echo "llm / $CHECK: skipped, no ANTHROPIC_API_KEY for this PR." >> "$GITHUB_STEP_SUMMARY"
            uv run --project gate/tools/llm-gate --locked llm-gate \
              --repo src --config gate/tools/llm-gate/checks.yaml \
              audit skip --check "$CHECK" --reason skipped_no_key --out "$GITHUB_WORKSPACE/.llm-gate"
          fi

      # The llm-override label counts only with an unedited `/llm-override <reason>` comment by
      # whoever added it, since the label was last removed (ADR 0005). Without one, the findings
      # still fail. Comment first, then add the label: the labelled run sees the comment.
      # The labels come from the API, not the event: `/llm-override` (llm-feedback.yml) adds the
      # label and re-runs this run, and a re-run keeps the original event's labels.
      - name: Override reason
        id: override
        if: steps.key.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          grep -qx llm-override <<< "$labels" || exit 0
          gh api --paginate "repos/$REPO/issues/$PR/events" --jq '.[]' | jq -s . > "$RUNNER_TEMP/events.json"
          gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[]' | jq -s . > "$RUNNER_TEMP/comments.json"
          gate/scripts/override-writers.sh "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/writers.json"
          if found=$(uv run --project gate/tools/llm-gate --locked llm-gate audit override \
              --events "$RUNNER_TEMP/events.json" --comments "$RUNNER_TEMP/comments.json" \
              --writers "$RUNNER_TEMP/writers.json" 2> "$RUNNER_TEMP/override-why.txt"); then
            {
              echo "honoured=true"
              echo "by=$(jq -r .by <<< "$found")"
              echo "reason=$(jq -r .reason <<< "$found" | tr -d '\r\n')"
            } >> "$GITHUB_OUTPUT"
          else
            why=$(tail -n 1 "$RUNNER_TEMP/override-why.txt")
            echo "::warning title=llm / $CHECK override not honoured::$why"
            echo "**llm-override not honoured:** $why" >> "$GITHUB_STEP_SUMMARY"
          fi

      # No result cache here, on purpose (F002, ADR 0002). Actions caches are shared by every
      # workflow run of the same ref, `pull_request` runs the PR's own workflow files, and the key
      # is sha256 of inputs the PR author knows: check, engine, model, the base's prompt and their
      # own diff. A sibling workflow the PR adds could therefore save a findings-free result and
      # llm-review would restore it as a verified pass. An HMAC wouldn't help, because that
      # workflow can read the same repository secrets. So a re-run of an unchanged PR pays again.

      - name: Review
        id: review
        if: steps.key.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MODEL_CHEAP: ${{ vars.LLM_MODEL_CHEAP }}
          LLM_GATE_OVERRIDE: ${{ steps.override.outputs.honoured == 'true' }}
          LLM_GATE_OVERRIDE_BY: ${{ steps.override.outputs.by }}
          LLM_GATE_OVERRIDE_REASON: ${{ steps.override.outputs.reason }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          uv run --project gate/tools/llm-gate --locked llm-gate \
            --repo src --config gate/tools/llm-gate/checks.yaml \
            run --check "$CHECK" --base "origin/$BASE_REF" --out "$GITHUB_WORKSPACE/.llm-gate" \
            > "$RUNNER_TEMP/review.md"
          status=$?
          set -e
          cat "$RUNNER_TEMP/review.md" >> "$GITHUB_STEP_SUMMARY"
          # No result file means llm-gate itself failed; report that as an error with its exit code.
          verdict=$(jq -r .verdict .llm-gate/results/"$CHECK".*.json 2> /dev/null | head -n 1 || true)
          overridden=$(jq -r '.override_honoured // false' .llm-gate/results/"$CHECK".*.json \
            2> /dev/null | head -n 1 || true)
          {
            echo "status=$status"
            echo "verdict=${verdict:-error}"
            echo "overridden=${overridden:-false}"
          } >> "$GITHUB_OUTPUT"

      # Posting is done here by the workflow (with the base commit's script), not by the model.
      # A failed comment (for example a read-only token) must not decide the check.
      - name: Sticky PR comment
        if: steps.review.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          mode=""
          case "$VERDICT" in not-applicable | not-needed) mode=--update-only ;; esac
          gate/scripts/upsert-pr-comment.sh $mode "$PR" "<!-- llm-gate:$CHECK -->" "$RUNNER_TEMP/review.md"

      # The raw results (model output included) stay here for 90 days; the audit log keeps only
      # their summary (ADR 0005).
      - name: Upload results
        if: steps.review.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llm-gate-${{ matrix.check }}
          path: .llm-gate/results/
          retention-days: 90
          overwrite: true # a re-run attempt replaces it

      - name: Upload the audit record
        if: always() && hashFiles('.llm-gate/audit.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.check }}
          path: .llm-gate/audit.jsonl
          retention-days: 7
          if-no-files-found: ignore

      - name: Verdict
        if: steps.review.outcome == 'success'
        env:
          STATUS: ${{ steps.review.outputs.status }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          OVERRIDDEN: ${{ steps.review.outputs.overridden }}
        run: |
          title="llm / $CHECK"
          case "$VERDICT" in
            overridden)
              echo "::warning title=$title overridden::Blocking findings reported; PR has the llm-override label." ;;
            fail)
              echo "::error title=$title::Blocking findings; see the PR comment or the job summary." ;;
            error)
              if [ "$OVERRIDDEN" = true ]; then
                echo "::warning title=$title unreviewed::Over the size cap; accepted by llm-override."
              else
                level=$([ "$STATUS" = 0 ] && echo warning || echo error)
                echo "::$level title=$title::The review could not run; see the job summary."
              fi ;;
          esac
          exit "$STATUS"
