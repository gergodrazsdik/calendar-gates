# Git hooks (installed by `just setup`). They are a convenience for fast feedback;
# the CI gates are the enforcement (gate drill 1 proves it).
pre-commit:
  parallel: true
  jobs:
    - name: csharpier
      glob: "*.cs"
      run: dotnet csharpier format {staged_files}
      stage_fixed: true
    - name: ruff
      root: tools/llm-gate/
      glob: "*.py"
      run: uv run ruff format {staged_files} && uv run ruff check --fix {staged_files}
      stage_fixed: true
    # scripts/*.py are outside the llm-gate project but the lint gate checks them, with the
    # version pinned in ci.yml and the `lint` recipe.
    - name: ruff-scripts
      glob: "scripts/*.py"
      run: uvx ruff@0.16.10 format {staged_files} && uvx ruff@0.16.10 check --fix {staged_files}
      stage_fixed: true
    - name: workflows
      glob: ".github/workflows/*.yml"
      run: actionlint {staged_files}
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact

# Commits made from a Claude Code session get a Claude-Session trailer that names the
# session's local tool-call log (.claude/hooks/session-audit.sh).
prepare-commit-msg:
  jobs:
    - name: claude-session
      run: scripts/claude-session-trailer.sh {1} {2}

commit-msg:
  jobs:
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}

pre-push:
  jobs:
    - name: tests
      run: just test
