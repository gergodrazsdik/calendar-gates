# LLM review checks. Each check's prompt is .claude/commands/llm-<name>.md (also a slash
# command in Claude Code). The verdict is computed by llm-gate from finding severities:
#   blocking: fails when a finding is at or above fail_on; a `/llm-override <reason>` comment plus
#     the `llm-override` label reports the findings without failing, and also accepts a diff over
#     max_diff_kb unreviewed (ADR 0002). Other errors always fail closed.
#   advisory: reports findings, never fails
# paths: the check only runs when the diff touches one of these globs.
# ${VAR:-default} is expanded from the environment (CI sets LLM_MODEL / LLM_MODEL_CHEAP; a risk
# level can change the engine, not the model, since #58).

defaults:
  engine: api
  model: ${LLM_MODEL:-claude-sonnet-5-5}
  max_diff_kb: 200
  # A *generated* file whose own diff is over this is left out of the review and named in the
  # comment, the audit record and the release attestation, so machine-written bulk doesn't crowd
  # the hand-written part of a change out of max_diff_kb (ADR 0002). Only trimmable_paths may be
  # left out, and only when the file also carries a generator's marker (`<auto-generated` and
  # friends), so a hand-written file padded past the cap stays under review. A blocking check still
  # needs an honoured llm-override before it reviews a diff with anything missing.
  max_file_kb: 64
  trimmable_paths: ["**/*.pb.cs", "**/*_pb2.py", "**/Migrations/*.cs", "**/*.seed.sql"]
  budget_usd: 0.50 # agent engine hard cap per run
  max_turns: 30 # agent engine
  on_error: fail # blocking checks fail closed

checks:
  code-review: {mode: blocking, fail_on: high, engine: agent}
  security-review: {mode: blocking, fail_on: medium}
  test-review: {mode: advisory, model: "${LLM_MODEL_CHEAP:-claude-haiku-5-5}"}
  # The contract also lives outside Endpoints/: Domain records returned as-is (IsoWeekInfo is the
  # /api/week JSON) and Program.cs (the /api group, OpenAPI, /health). And outside .cs entirely
  # (F023): the csproj and Directory.Packages.props carry the OpenAPI generator's version, the
  # Commit metadata /api/version reports, and Directory.Build.props the TargetFramework and
  # Nullable that decide how the document is generated; appsettings' AllowedHosts turns requests
  # into 400s.
  api-contract:
    mode: advisory
    paths:
      - src/**/Endpoints/**
      - src/**/Domain/**
      - src/**/Program.cs
      - src/**/*.csproj
      - src/**/appsettings*.json
      - Directory.Build.props
      - Directory.Packages.props
      - http/**
  workflow-review: {mode: advisory, paths: [".github/**"]}
  docs-drift: {mode: advisory, model: "${LLM_MODEL_CHEAP:-claude-haiku-5-5}"}

# AI-assisted detection (aidetect.py, ADR 0008). Self-declared markers: a transparency signal that
# raises triage by `ai_assisted_raise`, not proof either way.
ai_markers:
  trailers: ["Co-Authored-By: Claude", "Claude-Session:", "Assisted-by:"]
  pr_body: ["Generated with [Claude Code]"]
  branches: ["claude/*"]

# Risk triage (triage.py, ADR 0008), the `triage` job of llm-review.yml. The rules give the floor:
# every changed file gets the risk of its first matching rule (default_risk if none), the PR the
# maximum; size and AI assistance raise it. The model may raise the risk, never lower it; only a
# recorded `/llm-risk` can. The level decides which checks review, which block, and the engine
# and model of the blocking ones. Every check still reports: outside `run` it passes as
# "not needed at risk: <level>". A check blocking at any level must be required in main.json
# (scripts/check-ruleset-consistency.py).
triage:
  model: ${LLM_MODEL_CHEAP:-claude-haiku-5-5}
  max_diff_kb: 50 # what the model sees; the rules see every file
  default_risk: medium # CalendarGates.slnx, .gitignore, .vscode/ ...
  rules:
    - paths:
        [".github/**", "tools/llm-gate/**", ".claude/commands/llm-*", "scripts/**", ".gitattributes"]
      risk: high
      reason: changes CI or the gates
    # The deterministic gates' own configuration. These decide what `lint`, `format`, `grype` and
    # `build-test` accept, so an added ignore or a lowered threshold here is a gate change in the
    # sense AGENTS.md means, and used to fall through to default_risk: medium (F021).
    - paths:
        - .grype.yaml
        - .yamllint.yaml
        - .editorconfig
        - lefthook.yml
        - justfile
        - global.json
        - uv.toml
        - .config/**
        - Directory.Build.props
      risk: high
      reason: changes what a gate enforces
    - {paths: ["Dockerfile", "deploy/**"], risk: high, reason: runtime or deployment}
    - {paths: ["AGENTS.md", "CLAUDE.md", ".claude/**"], risk: medium, reason: instructions agents read}
    - paths: ["Directory.Packages.props", "**/packages.lock.json", "**/uv.lock"]
      risk: medium
      reason: dependencies
    - {paths: ["src/**"], risk: medium, reason: application code}
    - {paths: ["tests/**", "http/**", "docs/**", "**/*.md"], risk: low, reason: tests or docs}
  size: {medium_over_lines: 200, high_over_lines: 800} # added + deleted, lock files excluded
  ai_assisted_raise: 1
  levels:
    # api-contract runs here too, advisory as everything at this level: an http/**-only PR is
    # rated low, so the glob it was given never fired for exactly the PRs it was meant for (F024).
    low: {run: [code-review, docs-drift, api-contract], blocking: []}
    medium:
      run: [code-review, security-review, test-review, api-contract, docs-drift]
      blocking: [code-review, security-review]
    high:
      run: all
      blocking: [code-review, security-review]
      # The blocking checks move to the agent engine (it reads the surrounding code) and keep their
      # own model; advisory checks keep both. Opus was measured on 2026-10-17 and was no better
      # than Sonnet here, at 3-4x the cost (ADR 0008, docs/WRITEUP.md).
      engine: agent
