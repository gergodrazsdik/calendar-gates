apiVersion: v1
kind: Service
metadata:
  name: {{ include "calendar-gates.fullname" . }}
  labels:
    {{- include "calendar-gates.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "calendar-gates.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
