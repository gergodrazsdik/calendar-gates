# Either kind cluster: the image built by `just image`, loaded with `just k8s-load` (never
# pulled). The recipes default to the project cluster, where the policies deny this image outside
# `calendar-gates-dev`; `just cluster=local ...` targets kind-local (AGENTS.md).
image:
  repository: localhost/calendar-gates # podman prefixes local images with localhost/
  tag: dev
  pullPolicy: Never
