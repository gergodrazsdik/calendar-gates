# Kyverno for the project cluster (docs/adr/0010-admission-control.md), chart 3.10.0 = Kyverno
# v1.20.0. Every image is pinned to a digest whose SLSA provenance was verified on 2026-11-25
# (cosign verify-attestation --type slsaprovenance02: slsa-github-generator, built from
# kyverno/kyverno at f666af06e9, the v1.20.0 tag). The chart has no digest field, so the digest
# rides on the tag: repo:v1.20.0@sha256:..., where the digest wins. Update all of them together
# with the chart version and digest in deploy/kyverno/chart.sha256 (the recipes read the version
# from that file's name), after verifying the new release the same way.
admissionController:
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [""]
          resources: [pods/ephemeralcontainers]
          verbs: [get, list, watch]
  initContainer:
    image:
      tag: v1.20.0@sha256:339067e083430e0c97007541bef9cfdbac89bee13f7228772c77ae8aead14b8b
  container:
    image:
      tag: v1.20.0@sha256:9de49c5416ea536f00a205527197ac048abdf32c5a75d633cd9afff8928f359d
backgroundController:
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [""]
          resources: [pods/ephemeralcontainers]
          verbs: [get, list, watch]
  image:
    tag: v1.20.0@sha256:c72df38320a48fc9de10f9d23d087a117853bb08207b7f60f6d1e8457fb3ddb7
cleanupController:
  image:
    tag: v1.20.0@sha256:0f9ce0c203561c52499e871a987ff987371f57385fcafe7af1a01dfd6db1feee
reportsController:
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [""]
          resources: [pods/ephemeralcontainers]
          verbs: [get, list, watch]
  image:
    tag: v1.20.0@sha256:f54e3cc106fadb1a615d0ec11c42f741f51d3580a5f70dfbe7bd7ec58864ef03
crds:
  migration:
    image:
      tag: v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4
upgrade:
  legacyPolicyCheck:
    image:
      tag: v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4
webhooksCleanup:
  image:
    tag: v1.20.0@sha256:6079a30d75fe7ba868a5a7e5dfa71ee92a3a8bae97adcea1c8cfb1009280ee6c
