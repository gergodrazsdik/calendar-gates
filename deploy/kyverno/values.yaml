# Kyverno for the project cluster (docs/adr/0010-admission-control.md), chart 3.9.2 = Kyverno
# v1.19.2. Every image is pinned to a digest whose SLSA provenance was verified on 2026-11-02
# (cosign verify-attestation --type slsaprovenance02: slsa-github-generator, built from
# kyverno/kyverno at e63308f1e1, the v1.19.2 tag). The chart has no digest field, so the digest
# rides on the tag: repo:v1.19.2@sha256:..., where the digest wins. Update all of them together
# with the chart version and digest in deploy/kyverno/chart.sha256 (the recipes read the version
# from that file's name), after verifying the new release the same way.
admissionController:
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [""]
          resources: [pods/ephemeralcontainers]
          verbs: [get, list, watch]
  initContainer:
    image:
      tag: v1.19.2@sha256:27f3cc52e628559b56d08363b85316819802086c9808606914f7805a244148f4
  container:
    image:
      tag: v1.19.2@sha256:c8c4dd09e720d2cd7fd24ca73ac28e46651001372f988e0cba3f2f612f04b955
backgroundController:
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [""]
          resources: [pods/ephemeralcontainers]
          verbs: [get, list, watch]
  image:
    tag: v1.19.2@sha256:c46e124f21ef8a6bb4b48de57106808b1007edcd5ddd4ff7df5d23b9efa60ce2
cleanupController:
  image:
    tag: v1.19.2@sha256:d7340aa7c9315080c3dafa7b765d090ced37353e89e5cd7a3f9ac69e8fb532b2
reportsController:
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [""]
