# The release's LLM-review attestation (ADR 0009) must be there. Deny since v0.3.1: it started as
# Audit until releases carried it (v0.3.0, v0.3.1). The dev overlay still only audits
# (docs/adr/0010-admission-control.md).
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: calendar-gates-llm-review
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: calendar-gates
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        # The subresource is how `kubectl debug` adds an ephemeral container to a running pod.
        resources: [pods, pods/ephemeralcontainers]
  # A cold check fetches every attestation and the Sigstore trust root; 10 s (the default) isn't
  # always enough. Results are cached for an hour.
  webhookConfiguration:
    timeoutSeconds: 30
  matchImageReferences:
    - glob: "ghcr.io/gergodrazsdik/calendar-gates*"
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              # A regex can't be wrapped safely.
              # yamllint disable-line rule:line-length
              subjectRegExp: '^https://github\.com/gergodrazsdik/calendar-gates/\.github/workflows/release\.yml@refs/tags/v[0-9].*$'
  attestations:
    - name: llmreview
      intoto:
        type: https://github.com/gergodrazsdik/calendar-gates/attestations/llm-review/v1
  # Every container kind, not only spec.containers: an unattested image must not slip in as an init
  # or ephemeral container.
  variables:
    - name: allImages
      expression: images.containers + images.initContainers + images.ephemeralContainers
  validations:
    - expression: >-
        variables.allImages.map(image,
          verifyAttestationSignatures(image, attestations.llmreview, [attestors.release])).all(e, e > 0)
      message: the image has no LLM-review attestation signed by release.yml on a release tag
    # Until 2026-10-19 the policy stopped at the clause above, so "only reviewed code runs here"
    # actually meant "a document about reviews is attached": a release whose every PR was
    # unreviewed was admitted. This reads the predicate, like release.yaml's vuln-scan clause.
    #
    # `unreviewed` only: a PR with no review record for its merged head, or one whose blocking
    # checks never decided. `unverified` is deliberately *not* denied here. It marks a PR whose
    # run came from a modified workflow, which in this repository is most of them -- the gate is
    # what the PRs change -- and the predicate for v0.3.7 lists two such PRs (#87, #88) with
    # `unreviewed` empty. Denying on it would block every legitimate release, so it is reported
    # by `just verify-release` and in the release notes instead (ADR 0010).
    - expression: >-
        variables.allImages.map(image,
          verifyAttestationSignatures(image, attestations.llmreview, [attestors.release]) > 0
          && extractPayload(image, attestations.llmreview).predicate.unreviewed.size() == 0
        ).all(e, e)
      message: >-
        the image's LLM-review attestation lists pull requests that were never reviewed
