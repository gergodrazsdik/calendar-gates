# Namespaces for kyverno test: Enforcement weakened: the case the guard exists for.
# Each suite holds at most one of each namespace: kyverno test refuses duplicate names.
# Relabelled to enforce nothing.
apiVersion: v1
kind: Namespace
metadata:
  name: calendar-gates
  labels:
    kubernetes.io/metadata.name: calendar-gates
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Dev below baseline.
apiVersion: v1
kind: Namespace
metadata:
  name: calendar-gates-dev
  labels:
    kubernetes.io/metadata.name: calendar-gates-dev
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
