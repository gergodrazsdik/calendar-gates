# Namespaces for kyverno test: Enforcement removed, or no longer pinned to a minor version.
# Each suite holds at most one of each namespace: kyverno test refuses duplicate names.
# The enforce label removed.
apiVersion: v1
kind: Namespace
metadata:
  name: calendar-gates
  labels:
    kubernetes.io/metadata.name: calendar-gates
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Following the newest version silently.
apiVersion: v1
kind: Namespace
metadata:
  name: calendar-gates-dev
  labels:
    kubernetes.io/metadata.name: calendar-gates-dev
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
