# Pods for kyverno test (kyverno-test.yaml): what calendar-gates-workload admits and refuses.
# Each case is the chart's pod with exactly one change, so each fails exactly one rule.
# Generated once from that pod; edit the cases by hand from here on.
# yamllint disable rule:line-length
# The chart's pod (deploy/helm/calendar-gates/templates/deployment.yaml).
apiVersion: v1
kind: Pod
metadata: {name: compliant, namespace: calendar-gates}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1654
    runAsGroup: 1654
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: api
      image: ghcr.io/gergodrazsdik/calendar-gates@sha256:10f58f25e5c30254c1f2225fdd6cf308229736dd44175656cbc8d69eb921a7c5
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        limits: {memory: 256Mi}
      volumeMounts:
        - {name: tmp, mountPath: /tmp}
  volumes:
    - name: tmp
      emptyDir: {sizeLimit: 64Mi}
---
