# Test-only policy (not part of `deploy/policies`): it carries the one CEL clause from
# base/llm-review.yaml that decides whether an LLM-review attestation is acceptable, so the clause
# can be exercised offline. The real policy reads the clause's input through extractPayload(),
# which needs a registry and a signed attestation, and is proven end to end by release.yml's
# admission-smoke; what no test covers is the rule itself, which is how the policy went seven
# releases checking only that the attestation *existed*.
#
# scripts/check-policy-clauses.py keeps the clause below identical to the one in
# base/llm-review.yaml, so editing the rule there without updating these cases fails `just lint`.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: calendar-gates-llmreview-rule
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [test.calendar-gates.local]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        # A stand-in for the in-toto statement extractPayload() returns: the mock resource's
        # `predicate` is shaped like `llm-gate attest llm-review`'s output.
        resources: [llmreviewstatements]
  validations:
    - expression: object.predicate.unreviewed.size() == 0
      message: >-
        the image's LLM-review attestation lists pull requests that were never reviewed
