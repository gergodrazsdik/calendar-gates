extends: default

rules:
  line-length:
    max: 120
  document-start: disable
  # GitHub Actions' `on:` key
  truthy:
    allowed-values: ["true", "false", "on"]
    check-keys: true
  comments:
    min-spaces-from-content: 1

# deploy/helm/*/templates/ are Go templates: helm lint and kubeconform check them instead.
ignore: |
  artifacts/
  deploy/helm/*/templates/
  reports/
  TestResults/
